name: CI

on:
  push:
    branches:
      - main
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  python-tests:
    name: Python tests (pytest)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v5
        with:
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: '3.13'

      # The API route tests start the video service, which requires the
      # ffmpeg binary (the Dockerfile installs it the same way).
      - name: Install ffmpeg
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends ffmpeg

      - name: Install dependencies from uv.lock
        run: |
          python -m pip install uv==0.11.7
          uv sync --locked --extra dev --python 3.13

      - name: Lint (ruff)
        run: uv run --no-sync ruff check .

      - name: Run pytest
        run: uv run --no-sync python -m pytest -q

      # Boot the Streamlit web UI the way start_web.sh does and check that the
      # server answers. Streamlit >= 1.66 serves the UI with Starlette/Uvicorn
      # instead of Tornado. The page scripts themselves are rendered by
      # tests/web/test_streamlit_app.py (AppTest), because the server only runs
      # them when a browser session connects.
      - name: Smoke test Streamlit web UI
        shell: bash
        env:
          PORT: '8765'
        run: |
          set -euo pipefail
          log="$RUNNER_TEMP/streamlit.log"
          uv run --no-sync streamlit run web/app.py \
            --server.headless true --server.address 127.0.0.1 --server.port "$PORT" \
            --browser.gatherUsageStats false > "$log" 2>&1 &
          pid=$!
          trap 'kill "$pid" 2>/dev/null || true' EXIT
          health=""
          for _ in $(seq 1 60); do
            health="$(curl -sf "http://127.0.0.1:$PORT/_stcore/health" || true)"
            [ "$health" = "ok" ] && break
            sleep 1
          done
          if [ "$health" != "ok" ]; then
            cat "$log"
            echo "::error::Streamlit /_stcore/health did not return ok"
            exit 1
          fi
          page="$(curl -sf "http://127.0.0.1:$PORT/")"
          if ! grep -q '<div id="root"></div>' <<<"$page"; then
            cat "$log"
            echo "::error::Streamlit index page has no root div"
            exit 1
          fi
          echo "Streamlit health=ok, index page served"

  dashboard:
    name: Dashboard lint and build
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: dashboard
    steps:
      - name: Checkout
        uses: actions/checkout@v5
        with:
          persist-credentials: false

      - name: Set up Node.js
        uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: dashboard/package-lock.json

      - name: Install dependencies
        run: npm ci --no-audit --no-fund

      - name: Lint
        run: npm run lint

      - name: Build
        run: npm run build

  docker-image:
    name: Docker image build and API import
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@v5
        with:
          persist-credentials: false

      - name: Build image
        run: docker build --tag ai-video-workflow:ci .

      # A package that api/app.py imports but the Dockerfile does not COPY
      # builds fine and only fails when the API container starts (#44).
      - name: Import the API app inside the image
        run: docker run --rm ai-video-workflow:ci .venv/bin/python -c "import api.app"

  docs-build:
    name: Docs build (mkdocs, no deploy)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v5
        with:
          persist-credentials: false
          # Full history for the git-revision-date-localized plugin, which
          # warns on a shallow clone (a warning fails --strict).
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: '3.13'
          cache: pip
          cache-dependency-path: requirements-docs.txt

      - name: Install docs dependencies
        run: python -m pip install -r requirements-docs.txt

      # Same site the Deploy Documentation workflow publishes; --strict turns
      # broken links and plugin warnings into failures.
      - name: Build docs
        run: mkdocs build --strict --site-dir "$RUNNER_TEMP/site"
